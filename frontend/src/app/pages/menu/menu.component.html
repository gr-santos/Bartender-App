<main class="menu-page">
  <a routerLink="/" class="back-link">&larr; Back home</a>
  <h1>Cocktail Menu</h1>

  <p *ngIf="loading">Loading menu...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <ul class="menu-list" *ngIf="!loading">
    <li *ngFor="let cocktail of menu" class="menu-item">
      <div>
        <h3>{{ cocktail.name }} - {{ cocktail.price | currency }}</h3>
        <p>{{ cocktail.description }}</p>
      </div>
      <button (click)="selectCocktail(cocktail)">Order</button>
    </li>
  </ul>

  <div class="order-form" *ngIf="selectedCocktail">
    <h2>Place order for {{ selectedCocktail.name }}</h2>
    <label>
      Your name:
      <input type="text" [(ngModel)]="patronName" placeholder="Guest" name="patronName" />
    </label>
    <div class="form-actions">
      <button (click)="placeOrder()">Confirm Order</button>
      <button class="secondary" (click)="selectedCocktail = null">Cancel</button>
    </div>
  </div>

  <p class="confirmation" *ngIf="confirmationMessage">{{ confirmationMessage }}</p>
</main>

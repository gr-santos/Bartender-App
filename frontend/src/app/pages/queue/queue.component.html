<main class="queue-page">
  <a routerLink="/" class="back-link">&larr; Back home</a>
  <h1>Order Queue</h1>
  <button class="refresh" (click)="loadQueue()">Refresh</button>

  <p *ngIf="loading">Loading queue...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p *ngIf="!loading && queue.length === 0">No open orders right now.</p>

  <ul class="queue-list" *ngIf="!loading">
    <li *ngFor="let order of queue" class="queue-item">
      <div>
        <h3>#{{ order.id }} - {{ order.cocktail.name }}</h3>
        <p>Patron: {{ order.patronName }}</p>
        <p>Status: <span class="status" [class]="order.status">{{ order.status }}</span></p>
      </div>
      <div class="actions">
        <button *ngIf="order.status === 'queued'" (click)="markPreparing(order)">Start Preparing</button>
        <button *ngIf="order.status === 'preparing'" (click)="markReadyForPickup(order)">Ready for Pickup</button>
        <button *ngIf="order.status === 'ready_for_pickup'" (click)="markCompleted(order)">Picked Up</button>
      </div>
    </li>
  </ul>
</main>
